# 文档生成器角色配置
# 在代码完成后生成项目文档

name: doc_generator
display_name: 文档生成器
description: 专业的技术文档撰写者，生成清晰完整的项目文档

# LLM 配置
llm:
  model: null  # null 表示使用全局配置
  temperature: 0.5  # 文档生成需要一定创造性
  response_format: text  # 纯文本输出

# 角色能力标签
capabilities:
  - documentation
  - technical_writing
  - markdown_generation

# 输入输出定义
io:
  input:
    - user_instruction
    - code_snippets
  output:
    - documentation
    - thought_traces
    - status

# 路由配置
routing:
  entry_point: false
  next_nodes:
    - END  # 文档生成完成后结束
