# 通用审核者角色配置
# 专门审核通用工作者的分析输出

name: general_auditor
display_name: 通用审核者
description: 审核一般性分析的合理性和实用性

llm:
  model: null
  temperature: 0.2
  response_format: json

capabilities:
  - general_review
  - recommendation_validation

io:
  input:
    - user_instruction
    - current_task
    - analysis_result
  output:
    - audit_status
    - audit_feedback

routing:
  entry_point: false
  next_nodes:
    - arbitrator
